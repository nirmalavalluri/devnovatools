<script>
function clearAll(){
  const i=document.getElementById('input');
  const o=document.getElementById('output');
  if(i)i.value='';
  if(o){o.textContent='';o.innerHTML='';}
}
let timer=null;
async function run(){
  const secret=document.getElementById('input').value.trim().replace(/\s/g,'').toUpperCase();
  if(!secret){document.getElementById('output').textContent='Enter your TOTP secret key';return}
  try{
    const code=await generateTOTP(secret);
    const remaining=30-Math.floor(Date.now()/1000)%30;
    document.getElementById('output').textContent='Code: '+code+'\n\nExpires in: '+remaining+' seconds\n\n'+'['+('█'.repeat(Math.round(remaining/2.5)))+'░'.repeat(Math.max(0,12-Math.round(remaining/2.5)))+'] '+remaining+'s\n\nNext refresh at: '+new Date(Math.ceil(Date.now()/30000)*30000).toLocaleTimeString();
    document.getElementById('status').textContent=remaining+'s remaining';
  }catch(e){document.getElementById('output').textContent='\u2717 '+e.message+'\n\nMake sure your key is valid Base32 (A-Z, 2-7)'}
}
function startLive(){timer=setInterval(run,1000);run()}
function stopLive(){clearInterval(timer);timer=null}
async function generateTOTP(secret){
  const b32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits='';
  for(const c of secret){const i=b32.indexOf(c);if(i<0)throw new Error('Invalid Base32 character: '+c);bits+=i.toString(2).padStart(5,'0')}
  const bytes=new Uint8Array(bits.length/8|0);
  for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(bits.slice(i*8,i*8+8),2);
  const counter=Math.floor(Date.now()/30000);
  const msg=new Uint8Array(8);
  for(let i=7;i>=0;i--){msg[i]=counter&0xff;counter>>=8}
  const key=await crypto.subtle.importKey('raw',bytes,{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',key,msg);
  const hash=new Uint8Array(sig);
  const offset=hash[hash.length-1]&0xf;
  const code=((hash[offset]&0x7f)<<24|(hash[offset+1]&0xff)<<16|(hash[offset+2]&0xff)<<8|(hash[offset+3]&0xff))%1000000;
  return code.toString().padStart(6,'0');
}
</script>
