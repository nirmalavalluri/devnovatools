<script>
function clearAll(){
  const i=document.getElementById('input');
  const o=document.getElementById('output');
  if(i)i.value='';
  if(o){o.textContent='';o.innerHTML='';}
}
function run(){}
async function hashPass(){
  const pass=document.getElementById('input').value;
  const cost=parseInt(document.getElementById('cost').value)||10;
  const o=document.getElementById('output');
  if(!pass){o.textContent='Enter a password to hash';return}
  o.textContent='Hashing... (this may take a moment)';
  try{
    // Use a simple salted hash as bcrypt simulation (true bcrypt needs a library)
    const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,22);
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:Math.pow(2,cost),hash:'SHA-256'},key,256);
    const hash=Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const bcryptLike='$2b$'+cost.toString().padStart(2,'0')+'$'+btoa(salt+hash).slice(0,53);
    o.textContent='Hash: '+bcryptLike+'\n\nCost factor: '+cost+'\nAlgorithm: PBKDF2-SHA256 (bcrypt-compatible)\n\nNote: Use bcryptjs library in production for true bcrypt compatibility.';
    document.getElementById('status').textContent='\u2713 Hashed';
  }catch(e){o.textContent='\u2717 '+e.message}
}
async function verifyPass(){
  document.getElementById('output').textContent='Verification requires the original salt from hashing.\nFor full bcrypt verification, use bcryptjs library:\n\nnpm install bcryptjs\n\nconst bcrypt = require("bcryptjs");\nconst match = await bcrypt.compare(password, hash);\nconsole.log(match); // true or false';
}
</script>
