<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/database/">Database Tools</a> › <span>JSON to SQL Insert</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#34D39922;border:1px solid #34D39944">🔄</div>
      <h1 class="tool-name">JSON to SQL Insert</h1>
    </div>
    <p class="tool-desc">Generate SQL INSERT statements from a JSON array of objects</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>

  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JSON array...&#10;[&#10;  {&quot;name&quot;: &quot;Alice&quot;, &quot;age&quot;: 30, &quot;email&quot;: &quot;alice@example.com&quot;},&#10;  {&quot;name&quot;: &quot;Bob&quot;, &quot;age&quot;: 25, &quot;email&quot;: &quot;bob@example.com&quot;}&#10;]" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">SQL INSERT Statements</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>

<script src="/assets/layout.js"></script>
<script>function run(){const i=document.getElementById('input').value.trim();const table=document.getElementById('table').value.trim()||'my_table';const db=document.getElementById('db').value;const o=document.getElementById('output');if(!i){o.textContent='';return}try{const parsed=JSON.parse(i);const arr=Array.isArray(parsed)?parsed:[parsed];const cols=Object.keys(arr[0]);const q=db==='MySQL'?'`':db==='PostgreSQL'?'"':'';const stmts=arr.map(row=>{const vals=cols.map(c=>{const v=row[c];if(v===null||v===undefined)return'NULL';if(typeof v==='string')return"'"+v.replace(/'/g,"''")+"'";if(typeof v==='boolean')return db==='MySQL'?(v?'1':'0'):(v?'TRUE':'FALSE');return v});return'INSERT INTO '+q+table+q+' ('+cols.map(c=>q+c+q).join(', ')+') VALUES ('+vals.join(', ')+');'});o.textContent='-- Generated by DevNova Tools\n-- devnovatools.com\n\n'+stmts.join('\n');document.getElementById('status').textContent=arr.length+' INSERT statement(s)'}catch(e){o.textContent='\u2717 '+e.message}}</script>
