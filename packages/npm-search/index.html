<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>npm Package Search — Free Online Tool | DevNova Tools</title>
<meta name="description" content="Search npm registry and get package info, version and install commands. Free, no login required."/>
<meta property="og:image" content="https://devnovatools.com/assets/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://devnovatools.com/packages/npm-search/"/>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "npm Package Search", "applicationCategory": "DeveloperApplication", "operatingSystem": "Web Browser", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "description": "Search npm registry and get package info, version and install commands", "url": "https://devnovatools.com/packages/npm-search/"}</script>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/packages/">Package & Version</a> › <span>npm Package Search</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#60A5FA22;border:1px solid #60A5FA44">📦</div>
      <h1 class="tool-name">npm Package Search</h1>
    </div>
    <p class="tool-desc">Search npm registry and get package info, version and install commands</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="run()">Search npm</button>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter package name...&#10;e.g. react, axios, lodash, express, typescript" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Package Info</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>async function run(){const q=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!q){o.textContent='Enter a package name to search';return}o.textContent='Searching npm registry...';try{const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(q));if(!r.ok){o.textContent='\u2717 Package "'+q+'" not found on npm';return}const d=await r.json();const latest=d['dist-tags']?.latest||'?';const v=d.versions?.[latest]||{};const deps=Object.keys(v.dependencies||{});o.textContent=['Package:     '+d.name,'Version:     '+latest,'Description: '+(d.description||'N/A'),'Author:      '+(d.author?.name||v.author?.name||'N/A'),'License:     '+(v.license||d.license||'N/A'),'Homepage:    '+(d.homepage||v.homepage||'N/A'),'Repository:  '+(d.repository?.url?.replace('git+','').replace('.git','')||'N/A'),'Keywords:    '+(d.keywords?.slice(0,6).join(', ')||'N/A'),'Dependencies:'+(deps.length?'\n  '+deps.slice(0,8).join('\n  '):'none'),'','Install Commands:','  npm install '+d.name,'  npm install --save-dev '+d.name,'  yarn add '+d.name,'  pnpm add '+d.name,'','npm page:','  https://www.npmjs.com/package/'+d.name].join('\n');document.getElementById('status').textContent='v'+latest}catch(e){o.textContent='\u2717 '+e.message}}</script>
</body></html>
