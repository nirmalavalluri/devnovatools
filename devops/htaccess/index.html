<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>.htaccess Generator — DevNova Tools</title>
<meta name="description" content="Generate Apache .htaccess rules. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/devops/htaccess/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/devops/">DevOps & Infra</a> <span>›</span> <span>.htaccess Generator</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#FF6B3522;border:1px solid #FF6B3544">⚙️</div>
      <h1 class="tool-name">.htaccess Generator</h1>
    </div>
    <p class="tool-desc">Generate Apache .htaccess rules.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    <div class="form-row" style="flex-wrap:wrap;gap:12px">
  <label><input type="checkbox" id="https" onchange="generate()"/> Force HTTPS</label>
  <label><input type="checkbox" id="www" onchange="generate()"/> Remove www</label>
  <label><input type="checkbox" id="spa" onchange="generate()"/> SPA Routing</label>
  <label><input type="checkbox" id="cache" onchange="generate()"/> Browser Cache</label>
  <label><input type="checkbox" id="gzip" onchange="generate()"/> GZIP</label>
 </div>
 <button class="btn btn-primary btn-sm" onclick="generate()" style="margin-top:8px">Generate .htaccess</button>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Select options above..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Generated .htaccess</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){}
function generate(){let out='# Generated by DevNova Tools\nOptions -Indexes\n';if(document.getElementById('https').checked)out+='\n# Force HTTPS\nRewriteEngine On\nRewriteCond %{HTTPS} off\nRewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]\n';if(document.getElementById('www').checked)out+='\n# Remove www\nRewriteEngine On\nRewriteCond %{HTTP_HOST} ^www\\.(.+)$ [NC]\nRewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]\n';if(document.getElementById('spa').checked)out+='\n# SPA Routing\nRewriteEngine On\nRewriteBase /\nRewriteRule ^index\\.html$ - [L]\nRewriteCond %{REQUEST_FILENAME} !-f\nRewriteCond %{REQUEST_FILENAME} !-d\nRewriteRule . /index.html [L]\n';if(document.getElementById('cache').checked)out+='\n# Browser Cache\n<IfModule mod_expires.c>\nExpiresActive On\nExpiresByType text/css "access plus 1 month"\nExpiresByType application/javascript "access plus 1 month"\nExpiresByType image/png "access plus 1 year"\n</IfModule>\n';if(document.getElementById('gzip').checked)out+='\n# GZIP Compression\n<IfModule mod_deflate.c>\nAddOutputFilterByType DEFLATE text/html text/css application/javascript\n</IfModule>\n';document.getElementById('output').textContent=out||'# Select options above to generate rules';document.getElementById('status').textContent='Generated'}
</script>
</body>
</html>
