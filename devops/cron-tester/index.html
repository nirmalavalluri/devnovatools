<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cron Expression Tester — DevNova Tools</title>
<meta name="description" content="Test a cron expression and get human-readable description. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/devops/cron-tester/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/devops/">DevOps & Infra</a> <span>›</span> <span>Cron Expression Tester</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#FF6B3522;border:1px solid #FF6B3544">🧪</div>
      <h1 class="tool-name">Cron Expression Tester</h1>
    </div>
    <p class="tool-desc">Test a cron expression and get human-readable description.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter cron expression (e.g. 0 9 * * 1-5)..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Cron Description</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}const parts=i.split(/\s+/);if(parts.length!==5){o.textContent='\u2717 Cron needs exactly 5 parts:\nminute hour day-of-month month day-of-week\n\nExample: 0 9 * * 1-5';return}const[min,hour,dom,mon,dow]=parts;const d=describe(min,hour,dom,mon,dow);o.textContent='Expression: '+i+'\nDescription: '+d+'\n\nPart breakdown:\n  Minute:       '+min+'\n  Hour:         '+hour+'\n  Day of month: '+dom+'\n  Month:        '+mon+'\n  Day of week:  '+dow+'\n\nSpecial syntax:\n  * = any  , = list  - = range  / = step';document.getElementById('status').textContent='\u2713 Valid'}
function describe(min,hour,dom,mon,dow){const pre={'* * * * *':'Every minute','0 * * * *':'Every hour','0 0 * * *':'Daily at midnight','0 0 * * 0':'Every Sunday','0 0 1 * *':'First of every month','0 9 * * 1-5':'Weekdays at 9 AM','*/5 * * * *':'Every 5 minutes','*/15 * * * *':'Every 15 minutes','0 12 * * *':'Daily at noon'};return pre[[min,hour,dom,mon,dow].join(' ')]||'Custom schedule'}
</script>
</body>
</html>
