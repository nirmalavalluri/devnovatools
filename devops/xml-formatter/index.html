<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>XML Formatter — DevNova Tools</title>
<meta name="description" content="Format and prettify XML with proper indentation. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/devops/xml-formatter/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/devops/">DevOps & Infra</a> <span>›</span> <span>XML Formatter</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#FF6B3522;border:1px solid #FF6B3544">📋</div>
      <h1 class="tool-name">XML Formatter</h1>
    </div>
    <p class="tool-desc">Format and prettify XML with proper indentation.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    <div class="form-row"><div class="form-group"><label>Indent</label><select id="indent" onchange="run()"><option value="2">2 spaces</option><option value="4">4 spaces</option></select></div></div>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste XML to format..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Formatted XML</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{const doc=(new DOMParser()).parseFromString(i,'text/xml');const err=doc.querySelector('parsererror');if(err){o.textContent='\u2717 Invalid XML';return}const ind=parseInt(document.getElementById('indent').value)||2;const PAD=' '.repeat(ind);let d=0,result='';new XMLSerializer().serializeToString(doc).replace(/>\s+</g,'><').split(/(<[^>]+>)/).filter(n=>n.trim()).forEach(node=>{if(node.match(/^<\//)){d=Math.max(0,d-1);result+=PAD.repeat(d)+node+'\n'}else if(node.match(/^<[^!?/][^>]*[^/]>$/)){result+=PAD.repeat(d)+node+'\n';d++}else{result+=PAD.repeat(d)+node+'\n'}});o.textContent=result.trim();document.getElementById('status').className='badge badge-success';document.getElementById('status').textContent='\u2713 Valid XML'}catch(e){o.textContent='\u2717 '+e.message}}
</script>
</body>
</html>
