<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SSL Certificate Checker — Free Online Tool | DevNova Tools</title>
<meta name="description" content="Check SSL certificate info and expiry for any domain. Free, no login required."/>
<meta property="og:image" content="https://devnovatools.com/assets/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://devnovatools.com/network/ssl-expiry/"/>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "SSL Certificate Checker", "applicationCategory": "DeveloperApplication", "operatingSystem": "Web Browser", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "description": "Check SSL certificate info and expiry for any domain", "url": "https://devnovatools.com/network/ssl-expiry/"}</script>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/network/">Network & DNS</a> › <span>SSL Certificate Checker</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#4DA6FF22;border:1px solid #4DA6FF44">🔒</div>
      <h1 class="tool-name">SSL Certificate Checker</h1>
    </div>
    <p class="tool-desc">Check SSL certificate info and expiry for any domain</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="run()">Check SSL</button>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter domain...&#10;e.g. google.com&#10;e.g. devnovatools.com" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">SSL Info</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>async function run(){const d=document.getElementById('input').value.trim().replace(/^https?:\/\//,'').split('/')[0];const o=document.getElementById('output');if(!d){o.textContent='Enter a domain name';return}o.textContent='Domain: '+d+'\n\nFor full SSL certificate analysis:\n\u2022 https://www.ssllabs.com/ssltest/analyze.html?d='+d+'\n\u2022 https://crt.sh/?q='+d+'\n\nFor recent certificates:\n\u2022 https://crt.sh/?q=%.'+d+'\n\nTerminal commands:\nopenssl s_client -connect '+d+':443 2>/dev/null | openssl x509 -noout -dates\nopenssl s_client -connect '+d+':443 2>/dev/null | openssl x509 -noout -issuer -subject';document.getElementById('status').textContent='Links ready'}</script>
</body></html>
