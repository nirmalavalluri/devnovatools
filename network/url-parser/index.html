<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<meta name="description" content="Parse any URL into its components — protocol, host, path, query and fragment. Free, fast, no login required."/>
<meta name="robots" content="index, follow"/>
<meta property="og:title" content="URL Parser — DevNova Tools"/>
<meta property="og:image" content="https://devnovatools.com/assets/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://devnovatools.com/network/url-parser/"/>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "URL Parser", "applicationCategory": "DeveloperApplication", "operatingSystem": "Web Browser", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "description": "Parse any URL into its components \u2014 protocol, host, path, query and fragment", "url": "https://devnovatools.com/network/url-parser/"}</script>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/network/">Network & DNS</a> › <span>URL Parser</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#4DA6FF22;border:1px solid #4DA6FF44">🔗</div>
      <h1 class="tool-name">URL Parser</h1>
    </div>
    <p class="tool-desc">Parse any URL into its components — protocol, host, path, query and fragment</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="clearAll()">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter URL to parse...&#10;https://api.example.com:8080/users?page=1&limit=10#section" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">URL Components</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function clearAll(){
  const i=document.getElementById('input');
  const o=document.getElementById('output');
  if(i)i.value='';
  if(o){o.textContent='';o.innerHTML='';}
}
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{const u=new URL(i);const params=[...u.searchParams.entries()];o.textContent=['Full URL:   '+u.href,'Protocol:  '+u.protocol,'Host:      '+u.host,'Hostname:  '+u.hostname,'Port:      '+(u.port||'(default)'),`Path:      ${u.pathname}`,'Search:    '+(u.search||'(none)'),'Hash:      '+(u.hash||'(none)'),'',...(params.length?['Query Parameters:','─'.repeat(30),...params.map(([k,v])=>k.padEnd(20)+v)]:['No query parameters'])].join('\n');document.getElementById('status').textContent=params.length+' param(s)'}catch(e){o.textContent='\u2717 Invalid URL: '+e.message}}
</script>
</body>
</html>
