<script>
function clearAll(){
  const i=document.getElementById('input');
  const o=document.getElementById('output');
  if(i)i.value='';
  if(o){o.textContent='';o.innerHTML='';}
}
const MIME={'.html':'text/html','.htm':'text/html','.css':'text/css','.js':'text/javascript','.mjs':'text/javascript','.ts':'text/typescript','.json':'application/json','.xml':'application/xml','.yaml':'application/x-yaml','.yml':'application/x-yaml','.csv':'text/csv','.txt':'text/plain','.md':'text/markdown','.pdf':'application/pdf','.zip':'application/zip','.tar':'application/x-tar','.gz':'application/gzip','.7z':'application/x-7z-compressed','.rar':'application/x-rar-compressed','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.gif':'image/gif','.webp':'image/webp','.svg':'image/svg+xml','.ico':'image/x-icon','.bmp':'image/bmp','.tiff':'image/tiff','.mp4':'video/mp4','.webm':'video/webm','.ogg':'video/ogg','.avi':'video/x-msvideo','.mov':'video/quicktime','.mp3':'audio/mpeg','.wav':'audio/wav','.ogg':'audio/ogg','.flac':'audio/flac','.aac':'audio/aac','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf','.otf':'font/otf','.eot':'application/vnd.ms-fontobject','.xlsx':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','.xls':'application/vnd.ms-excel','.docx':'application/vnd.openxmlformats-officedocument.wordprocessingml.document','.doc':'application/msword','.pptx':'application/vnd.openxmlformats-officedocument.presentationml.presentation','.ppt':'application/vnd.ms-powerpoint','.wasm':'application/wasm','.sh':'application/x-sh','.py':'text/x-python','.rb':'text/x-ruby','.go':'text/x-go','.rs':'text/x-rust','.c':'text/x-c','.cpp':'text/x-c++','.h':'text/x-c','.java':'text/x-java-source','.php':'text/x-php','.sql':'application/sql','.graphql':'application/graphql'};
function run(){const q=document.getElementById('input').value.trim().toLowerCase();const o=document.getElementById('output');if(!q){o.textContent=Object.entries(MIME).slice(0,20).map(([e,m])=>e.padEnd(12)+m).join('\n')+'\n\n...type to search more';return}const matches=Object.entries(MIME).filter(([e,m])=>e.includes(q)||m.includes(q)||e.replace('.','')===q);if(!matches.length){o.textContent='No results for "'+q+'"';return}o.textContent=matches.map(([e,m])=>e.padEnd(12)+m).join('\n');document.getElementById('status').textContent=matches.length+' result(s)'}
</script>
