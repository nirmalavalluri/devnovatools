<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HTTP Response Inspector — Free Online Tool | DevNova Tools</title>
<meta name="description" content="Inspect HTTP response headers from any public URL. Free, no login required."/>
<meta property="og:image" content="https://devnovatools.com/assets/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://devnovatools.com/network/http-inspector/"/>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "HTTP Response Inspector", "applicationCategory": "DeveloperApplication", "operatingSystem": "Web Browser", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "description": "Inspect HTTP response headers from any public URL", "url": "https://devnovatools.com/network/http-inspector/"}</script>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/network/">Network & DNS</a> › <span>HTTP Response Inspector</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#4DA6FF22;border:1px solid #4DA6FF44">🔭</div>
      <h1 class="tool-name">HTTP Response Inspector</h1>
    </div>
    <p class="tool-desc">Inspect HTTP response headers from any public URL</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="run()">Inspect Headers</button>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter URL to inspect...&#10;e.g. https://api.github.com&#10;e.g. https://devnovatools.com" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Response Headers</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>async function run(){const url=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!url){o.textContent='Enter a URL';return}o.textContent='Fetching headers from '+url+'...';try{const r=await fetch(url,{mode:'cors'});const headers=[...r.headers.entries()];o.textContent='Status: '+r.status+' '+r.statusText+'\nURL: '+r.url+'\n\n\u2500\u2500 RESPONSE HEADERS \u2500\u2500\n'+headers.map(([k,v])=>k.padEnd(28)+v).join('\n');document.getElementById('status').textContent=r.status+' \u2014 '+headers.length+' headers'}catch(e){o.textContent='\u2717 Could not fetch headers\nError: '+e.message+'\n\nSome URLs block browser requests due to CORS.\nTry: https://api.github.com or https://httpbin.org/get'}}</script>
</body></html>
