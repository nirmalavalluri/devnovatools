<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IP Geolocation — Free Online Tool | DevNova Tools</title>
<meta name="description" content="Geolocate any IP address with detailed location information. Free, no login required."/>
<meta property="og:image" content="https://devnovatools.com/assets/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://devnovatools.com/network/ip-geolocation/"/>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "IP Geolocation", "applicationCategory": "DeveloperApplication", "operatingSystem": "Web Browser", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "description": "Geolocate any IP address with detailed location information", "url": "https://devnovatools.com/network/ip-geolocation/"}</script>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/network/">Network & DNS</a> › <span>IP Geolocation</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#4DA6FF22;border:1px solid #4DA6FF44">📍</div>
      <h1 class="tool-name">IP Geolocation</h1>
    </div>
    <p class="tool-desc">Geolocate any IP address with detailed location information</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="run()">Lookup IP</button>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter IP address or leave blank for your own IP..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Geolocation Data</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>async function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');o.textContent='Looking up...';try{const r=await fetch('https://ipapi.co/'+(i||'json')+'/json/');const d=await r.json();if(d.error){o.textContent='\u2717 '+d.reason;return}o.textContent='IP Address:  '+d.ip+'\nCity:        '+(d.city||'N/A')+'\nRegion:      '+(d.region||'N/A')+'\nCountry:     '+(d.country_name||'N/A')+' ('+d.country+')'+'\nTimezone:    '+(d.timezone||'N/A')+'\nISP/Org:     '+(d.org||'N/A')+'\nCoordinates: '+(d.latitude||'?')+', '+(d.longitude||'?')+'\nCurrency:    '+(d.currency||'N/A')+'\nLanguages:   '+(d.languages||'N/A');document.getElementById('status').textContent='\u2713 Found'}catch(e){o.textContent='\u2717 '+e.message}}</script>
</body></html>
