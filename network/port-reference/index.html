<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/network/">Network & DNS</a> › <span>Port Reference</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#4DA6FF22;border:1px solid #4DA6FF44">🔌</div>
      <h1 class="tool-name">Port Reference</h1>
    </div>
    <p class="tool-desc">Common TCP/UDP ports and their associated services reference</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='',document.getElementById('output').innerHTML='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Search port number or service name..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Port Reference</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
  <div style="margin-top:16px;background:var(--success-bg);border:1px solid rgba(0,214,143,.2);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--success)">
    🔒 All processing runs in your browser. Your data is never sent to any server.
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>const PORTS={'20':'FTP Data','21':'FTP Control','22':'SSH / SFTP','23':'Telnet','25':'SMTP (mail)','53':'DNS','67':'DHCP Server','68':'DHCP Client','80':'HTTP','110':'POP3','143':'IMAP','443':'HTTPS','445':'SMB (Windows)','465':'SMTPS','587':'SMTP Submission','636':'LDAPS','993':'IMAPS','995':'POP3S','1433':'Microsoft SQL Server','1521':'Oracle Database','2181':'Apache ZooKeeper','3000':'Dev Server (Node/React)','3306':'MySQL / MariaDB','3389':'RDP (Remote Desktop)','4200':'Angular Dev Server','5000':'Flask Dev Server','5432':'PostgreSQL','5672':'RabbitMQ','5900':'VNC Remote Desktop','6379':'Redis','6443':'Kubernetes API Server','8080':'HTTP Alternate','8443':'HTTPS Alternate','8888':'Jupyter Notebook','9000':'SonarQube / PHP-FPM','9090':'Prometheus','9200':'Elasticsearch HTTP','9300':'Elasticsearch Cluster','27017':'MongoDB','27018':'MongoDB Shard','50070':'Hadoop NameNode'};
function run(){const q=document.getElementById('input').value.trim();const o=document.getElementById('output');const m=Object.entries(PORTS).filter(([p,s])=>!q||p.includes(q)||s.toLowerCase().includes(q.toLowerCase()));if(!m.length){o.textContent='No results for "'+q+'"';return}o.textContent='Port      Service\n'+'\u2500'.repeat(40)+'\n'+m.map(([p,s])=>p.padEnd(10)+s).join('\n');document.getElementById('status').textContent=m.length+' port(s)'}</script>
</body></html>
