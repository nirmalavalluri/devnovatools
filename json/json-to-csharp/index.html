<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JSON to C# Class — DevNova Tools</title>
<meta name="description" content="Generate C# classes with properties from any JSON object. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/json/json-to-csharp/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/json/">JSON & Data</a> <span>›</span> <span>JSON to C# Class</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00C89622;border:1px solid #00C89644">#️⃣</div>
      <h1 class="tool-name">JSON to C# Class</h1>
    </div>
    <p class="tool-desc">Generate C# classes with properties from any JSON object.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JSON to generate C# class..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">C# Class</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{o.textContent='using System;\nusing System.Collections.Generic;\n\n'+genCS(JSON.parse(i),'Root');document.getElementById('status').textContent='Class generated'}catch(e){o.textContent='\u2717 '+e.message}}
function csType(v,k){if(v===null)return'string?';if(typeof v==='string')return'string';if(Number.isInteger(v))return'int';if(typeof v==='number')return'double';if(typeof v==='boolean')return'bool';if(Array.isArray(v))return'List<object>';if(typeof v==='object')return k.charAt(0).toUpperCase()+k.slice(1);return'object'}
function genCS(obj,name){if(!obj||typeof obj!=='object'||Array.isArray(obj))return'';const props=Object.entries(obj).map(([k,v])=>'    public '+csType(v,k)+' '+k.charAt(0).toUpperCase()+k.slice(1)+' { get; set; }');return'public class '+name+'\n{\n'+props.join('\n')+'\n}'}
</script>
</body>
</html>
