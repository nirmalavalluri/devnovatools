<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JSON Tree Viewer — DevNova Tools</title>
<meta name="description" content="Visualize JSON as an interactive expandable tree. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/json/tree-viewer/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/json/">JSON & Data</a> <span>›</span> <span>JSON Tree Viewer</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00C89622;border:1px solid #00C89644">🌳</div>
      <h1 class="tool-name">JSON Tree Viewer</h1>
    </div>
    <p class="tool-desc">Visualize JSON as an interactive expandable tree.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JSON to visualize..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Tree View</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.innerHTML='';return}try{const p=JSON.parse(i);o.innerHTML=renderTree(p,'root',0);document.getElementById('status').textContent='Tree rendered'}catch(e){o.textContent='\u2717 '+e.message}}
function renderTree(v,k,d){const ind='\u00a0'.repeat(d*4);if(v===null)return'<div>'+ind+'<span style="color:var(--text-muted)">'+k+':</span> <span style="color:var(--text-secondary)">null</span></div>';if(typeof v==='string')return'<div>'+ind+'<span style="color:var(--text-muted)">'+k+':</span> <span style="color:var(--green)">"'+v+'"</span></div>';if(typeof v==='number'||typeof v==='boolean')return'<div>'+ind+'<span style="color:var(--text-muted)">'+k+':</span> <span style="color:var(--cyan)">'+v+'</span></div>';const isArr=Array.isArray(v);const id='n'+Math.random().toString(36).slice(2);const items=Object.entries(v).map(([k2,v2])=>renderTree(v2,isArr?'['+k2+']':k2,d+1)).join('');return'<div>'+ind+'<span style="cursor:pointer;color:var(--blue);font-weight:600" onclick="const el=document.getElementById(\''+id+'\');el.style.display=el.style.display===\'none\'?\'block\':\'none\'">\u25be '+k+' <span style="color:var(--text-muted);font-size:.8em">'+(isArr?'['+v.length+']':'{'+Object.keys(v).length+'}')+'</span></span><div id="'+id+'" style="border-left:2px solid var(--border);margin-left:8px">'+items+'</div></div>'}
</script>
</body>
</html>
