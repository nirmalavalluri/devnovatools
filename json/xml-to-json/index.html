<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>XML to JSON — DevNova Tools</title>
<meta name="description" content="Convert XML to JSON format using the browser DOM parser. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/json/xml-to-json/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/json/">JSON & Data</a> <span>›</span> <span>XML to JSON</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00C89622;border:1px solid #00C89644">🔁</div>
      <h1 class="tool-name">XML to JSON</h1>
    </div>
    <p class="tool-desc">Convert XML to JSON format using the browser DOM parser.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste XML here..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">JSON Output</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{const doc=(new DOMParser()).parseFromString(i,'text/xml');const err=doc.querySelector('parsererror');if(err){o.textContent='\u2717 Invalid XML';return}o.textContent=JSON.stringify(xmlToObj(doc.documentElement),null,2);document.getElementById('status').textContent='Converted'}catch(e){o.textContent='\u2717 '+e.message}}
function xmlToObj(node){if(node.nodeType===3)return node.textContent.trim();const obj={};if(node.attributes&&node.attributes.length)[...node.attributes].forEach(a=>obj['@'+a.name]=a.value);const children=[...node.childNodes].filter(n=>n.nodeType!==3||n.textContent.trim());if(!children.length)return node.textContent.trim()||null;children.forEach(c=>{if(c.nodeType===3){obj['#text']=c.textContent.trim()}else{const k=c.tagName;const v=xmlToObj(c);if(obj[k]){if(!Array.isArray(obj[k]))obj[k]=[obj[k]];obj[k].push(v)}else obj[k]=v}});return obj}
</script>
</body>
</html>
