<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/json/">JSON & Data</a> › <span>JSON to Java</span></div>

    </div>

      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="clearAll()">Clear</button>

  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JSON to generate Java class...&#10;{&quot;id&quot;:1,&quot;name&quot;:&quot;Alice&quot;,&quot;active&quot;:true}" oninput="run()" spellcheck="false"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Java Class</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button></div></div>

  </div>

<script src="/assets/layout.js"></script>
<script>
function clearAll(){
  const i=document.getElementById('input');
  const o=document.getElementById('output');
  if(i)i.value='';
  if(o){o.textContent='';o.innerHTML='';}
}
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{const p=JSON.parse(i);o.textContent=genJava(p,'Root');document.getElementById('status').textContent='POJO generated'}catch(e){o.textContent='\u2717 '+e.message}}
function javaType(v,k){if(v===null)return'Object';if(typeof v==='string')return'String';if(Number.isInteger(v))return'int';if(typeof v==='number')return'double';if(typeof v==='boolean')return'boolean';if(Array.isArray(v))return'List<Object>';if(typeof v==='object')return k.charAt(0).toUpperCase()+k.slice(1);return'Object'}
function genJava(obj,name){if(!obj||typeof obj!=='object'||Array.isArray(obj))return'';const fields=Object.entries(obj).map(([k,v])=>'    private '+javaType(v,k)+' '+k+';');const getters=Object.entries(obj).map(([k,v])=>{const t=javaType(v,k);const cap=k.charAt(0).toUpperCase()+k.slice(1);return'    public '+t+' get'+cap+'() { return '+k+'; }\n    public void set'+cap+'('+t+' '+k+') { this.'+k+' = '+k+'; }'});return'public class '+name+' {\n\n'+fields.join('\n')+'\n\n'+getters.join('\n\n')+'\n}'}
</script>
