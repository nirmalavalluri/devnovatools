<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JSON to XML — DevNova Tools</title>
<meta name="description" content="Convert JSON to XML format. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/json/json-to-xml/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/json/">JSON & Data</a> <span>›</span> <span>JSON to XML</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00C89622;border:1px solid #00C89644">🔁</div>
      <h1 class="tool-name">JSON to XML</h1>
    </div>
    <p class="tool-desc">Convert JSON to XML format.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JSON here..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">XML Output</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}try{o.textContent='<?xml version="1.0" encoding="UTF-8"?>\n'+toXML(JSON.parse(i),'root',0);document.getElementById('status').textContent='Converted'}catch(e){o.textContent='\u2717 '+e.message}}
function toXML(v,tag,d){const ind='  '.repeat(d);if(v===null||typeof v!=='object')return ind+'<'+tag+'>'+v+'</'+tag+'>';if(Array.isArray(v))return v.map(item=>toXML(item,tag,d)).join('\n');const inner=Object.entries(v).map(([k,val])=>toXML(val,k,d+1)).join('\n');return ind+'<'+tag+'>\n'+inner+'\n'+ind+'</'+tag+'>'}
</script>
</body>
</html>
