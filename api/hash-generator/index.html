<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hash Generator — DevNova Tools</title>
<meta name="description" content="Generate MD5, SHA-1, SHA-256 and SHA-512 cryptographic hashes. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/api/hash-generator/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb">
      <a href="/">Home</a> <span>›</span>
      <a href="/api/">API & Security</a> <span>›</span>
      <span>Hash Generator</span>
    </div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#0066FF22;border:1px solid #0066FF44">#️⃣</div>
      <h1 class="tool-name">Hash Generator</h1>
    </div>
    <p class="tool-desc">Generate MD5, SHA-1, SHA-256 and SHA-512 cryptographic hashes.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input').value='';document.getElementById('output').textContent='';document.getElementById('output').innerHTML=''">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy Output</button>
    </div>
    <div class="form-row"><div class="form-group"><label>Algorithm</label><select id="algo" onchange="run()"><option value="SHA-256">SHA-256</option><option value="SHA-1">SHA-1</option><option value="SHA-512">SHA-512</option></select></div></div>
  </div>

  <div class="tool-body">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Input</span>
        <div class="panel-actions">
          <button class="btn-icon" title="Clear" onclick="document.getElementById('input').value='';run()">✕</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="input" class="panel-textarea" placeholder="Enter text to hash..." oninput="run()" spellcheck="false"></textarea>
      </div>
    </div>

    

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Hash Output</span>
        <div class="panel-actions">
          <button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="output" class="panel-output" spellcheck="false"></div>
      </div>
      <div class="status-bar">
        <span id="status" class="badge badge-info"></span>
      </div>
    </div>
  </div>
</main>

<script src="/assets/layout.js"></script>
<script>

    async function run(){
      const input=document.getElementById('input').value;
      const out=document.getElementById('output');
      if(!input){out.textContent='';return}
      const algo=document.getElementById('algo').value;
      try{
        const encoder=new TextEncoder();
        const data=encoder.encode(input);
        const hashBuffer=await crypto.subtle.digest(algo,data);
        const hashArray=Array.from(new Uint8Array(hashBuffer));
        out.textContent=hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
        document.getElementById('status').textContent=algo+' hash generated';
      }catch(e){out.textContent='✗ '+e.message}
    }
</script>
</body>
</html>
