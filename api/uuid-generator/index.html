<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UUID Generator — DevNova Tools</title>
<meta name="description" content="Generate cryptographically secure UUIDs (v4) in bulk. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/api/uuid-generator/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb">
      <a href="/">Home</a> <span>›</span>
      <a href="/api/">API & Security</a> <span>›</span>
      <span>UUID Generator</span>
    </div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#0066FF22;border:1px solid #0066FF44">🆔</div>
      <h1 class="tool-name">UUID Generator</h1>
    </div>
    <p class="tool-desc">Generate cryptographically secure UUIDs (v4) in bulk.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input').value='';document.getElementById('output').textContent='';document.getElementById('output').innerHTML=''">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy Output</button>
    </div>
    <div class="form-row"><div class="form-group"><label>Count</label><input type="number" id="count" value="1" min="1" max="100" style="width:80px"/></div><button class="btn btn-primary btn-sm" onclick="generate()">Generate</button></div>
  </div>

  <div class="tool-body">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Input</span>
        <div class="panel-actions">
          <button class="btn-icon" title="Clear" onclick="document.getElementById('input').value='';run()">✕</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="input" class="panel-textarea" placeholder="Click Generate to create UUIDs" oninput="run()" spellcheck="false"></textarea>
      </div>
    </div>

    

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Generated UUIDs</span>
        <div class="panel-actions">
          <button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent||document.getElementById('output').innerText,this)">Copy</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="output" class="panel-output" spellcheck="false"></div>
      </div>
      <div class="status-bar">
        <span id="status" class="badge badge-info"></span>
      </div>
    </div>
  </div>
</main>

<script src="/assets/layout.js"></script>
<script>

    function run(){generate()}
    function generate(){
      const count=parseInt(document.getElementById('count').value)||1;
      const uuids=Array.from({length:Math.min(count,100)},()=>crypto.randomUUID());
      document.getElementById('output').textContent=uuids.join('\n');
      document.getElementById('status').textContent=uuids.length+' UUID(s) generated';
    }
</script>
</body>
</html>
