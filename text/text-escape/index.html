<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Text Escape/Unescape — DevNova Tools</title>
<meta name="description" content="Escape or unescape special characters in strings. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/text/text-escape/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/text/">Text & Parsing</a> <span>›</span> <span>Text Escape/Unescape</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#7B61FF22;border:1px solid #7B61FF44">\\</div>
      <h1 class="tool-name">Text Escape/Unescape</h1>
    </div>
    <p class="tool-desc">Escape or unescape special characters in strings.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    <div class="form-row"><button class="btn btn-primary btn-sm" onclick="escapeText()">Escape</button><button class="btn btn-secondary btn-sm" onclick="unescapeText()">Unescape</button></div>
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter text to escape or unescape..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Result</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){escapeText()}function escapeText(){const i=document.getElementById('input').value;document.getElementById('output').textContent=i.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t').replace(/"/g,'\\"');setS('success','Escaped')}function unescapeText(){try{document.getElementById('output').textContent=JSON.parse('"'+document.getElementById('input').value+'"');setS('success','Unescaped')}catch(e){setS('error','Invalid escape sequences')}}function setS(t,m){const s=document.getElementById('status');s.className='badge badge-'+t;s.textContent=m}
</script>
</body>
</html>
