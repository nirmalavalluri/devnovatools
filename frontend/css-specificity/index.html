<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CSS Specificity Calculator — DevNova Tools</title>
<meta name="description" content="Calculate the specificity score of any CSS selector. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/frontend/css-specificity/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/frontend/">Frontend Tools</a> <span>›</span> <span>CSS Specificity Calculator</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00D4FF22;border:1px solid #00D4FF44">🎯</div>
      <h1 class="tool-name">CSS Specificity Calculator</h1>
    </div>
    <p class="tool-desc">Calculate the specificity score of any CSS selector.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Enter CSS selectors (one per line)..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Specificity Scores</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}const sels=i.split('\n').map(s=>s.trim()).filter(Boolean);const results=sels.map(sel=>{let a=0,b=0,c=0;let s=sel;const ids=s.match(/#[a-zA-Z0-9_-]+/g)||[];a=ids.length;s=s.replace(/#[a-zA-Z0-9_-]+/g,'');const cls=s.match(/\.[a-zA-Z0-9_-]+|\[[^\]]+\]|:[a-zA-Z-]+/g)||[];b=cls.length;s=s.replace(/\.[a-zA-Z0-9_-]+|\[[^\]]+\]|:[a-zA-Z-]+/g,'');const tags=s.match(/[a-zA-Z][a-zA-Z0-9]*/g)||[];c=tags.length;const score=a*100+b*10+c;return sel+'\n  ('+a+', '+b+', '+c+') = score '+score+' - '+(a>0?'ID level':b>0?'Class level':'Element level')});o.textContent=results.join('\n\n')}
</script>
</body>
</html>
