<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JS Minifier — DevNova Tools</title>
<meta name="description" content="Minify JavaScript by removing comments and whitespace. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/frontend/js-minifier/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/frontend/">Frontend Tools</a> <span>›</span> <span>JS Minifier</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00D4FF22;border:1px solid #00D4FF44">⚡</div>
      <h1 class="tool-name">JS Minifier</h1>
    </div>
    <p class="tool-desc">Minify JavaScript by removing comments and whitespace.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste JavaScript to minify..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Minified JS</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value;const o=document.getElementById('output');if(!i){o.textContent='';return}let m=i.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\n+/g,'\n').replace(/[ \t]+/g,' ').replace(/\s*([{}();:,=!<>+\-*\/|&?[\]]|=>)\s*/g,'$1').trim();const s=Math.round((1-m.length/i.length)*100);o.textContent=m;document.getElementById('status').textContent='Saved '+s+'% ('+i.length+' \u2192 '+m.length+' bytes)'}
</script>
</body>
</html>
