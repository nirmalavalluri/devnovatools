<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HTML Beautifier — DevNova Tools</title>
<meta name="description" content="Format and indent HTML code for better readability. Free, fast, no login required."/>
<link rel="canonical" href="https://devnovatools.com/frontend/html-beautifier/"/>
<link rel="stylesheet" href="/assets/shared.css"/>
</head>
<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/frontend/">Frontend Tools</a> <span>›</span> <span>HTML Beautifier</span></div>
    <div class="tool-title-row">
      <div class="tool-icon-wrap" style="background:#00D4FF22;border:1px solid #00D4FF44">💅</div>
      <h1 class="tool-name">HTML Beautifier</h1>
    </div>
    <p class="tool-desc">Format and indent HTML code for better readability.</p>
    <div class="tool-actions">
      <button class="btn btn-primary btn-sm" onclick="run()">▶ Run</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('input')&&(document.getElementById('input').value='');document.getElementById('output')&&(document.getElementById('output').textContent='')">Clear</button>
      <button class="btn btn-ghost btn-sm" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy Output</button>
    </div>
    
  </div>
  <div class="tool-body">
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Input</span><div class="panel-actions"><button class="btn-icon" onclick="document.getElementById('input').value='';run()">✕</button></div></div>
      <div class="panel-body"><textarea id="input" class="panel-textarea" placeholder="Paste HTML to beautify..." oninput="run()" spellcheck="false"></textarea></div>
    </div>
    
    <div class="panel">
      <div class="panel-header"><span class="panel-label">Formatted HTML</span><div class="panel-actions"><button class="copy-btn" onclick="DevNova.copyToClipboard(document.getElementById('output').textContent,this)">Copy</button></div></div>
      <div class="panel-body"><div id="output" class="panel-output"></div></div>
      <div class="status-bar"><span id="status" class="badge badge-info"></span></div>
    </div>
  </div>
</main>
<script src="/assets/layout.js"></script>
<script>
function run(){const i=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!i){o.textContent='';return}const VOID=['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'];let depth=0,result='';i.replace(/>\s+</g,'><').split(/(<[^>]+>|[^<]+)/).filter(n=>n.trim()).forEach(node=>{if(!node.trim())return;if(node.startsWith('</')){depth=Math.max(0,depth-1);result+='  '.repeat(depth)+node+'\n'}else if(node.startsWith('<!')||node.startsWith('<?')){result+='  '.repeat(depth)+node+'\n'}else if(node.startsWith('<')){const tag=(node.match(/<([a-zA-Z]+)/)||[])[1]||'';result+='  '.repeat(depth)+node+'\n';if(!VOID.includes(tag.toLowerCase())&&!node.endsWith('/>'))depth++}else{result+='  '.repeat(depth)+node.trim()+'\n'}});o.textContent=result.trim();document.getElementById('status').textContent='Formatted'}
</script>
</body>
</html>
