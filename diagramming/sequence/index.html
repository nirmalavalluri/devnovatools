<body>
<main class="tool-page">
  <div class="tool-header">
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/diagramming/">Diagramming</a> › <span>Sequence Diagram</span></div>

<script>const EX={auth:'sequenceDiagram\n    participant User\n    participant Client\n    participant API\n    participant DB\n    User->>Client: Enter credentials\n    Client->>API: POST /auth/login\n    API->>DB: SELECT * FROM users WHERE email=?\n    DB-->>API: User record\n    API->>API: Verify password hash\n    API-->>Client: 200 OK { token: "JWT..." }\n    Client->>Client: Store JWT in localStorage',api:'sequenceDiagram\n    Client->>API Gateway: GET /api/users\n    API Gateway->>Auth Service: Validate JWT\n    Auth Service-->>API Gateway: Valid ✓\n    API Gateway->>User Service: Forward request\n    User Service->>Database: SELECT * FROM users\n    Database-->>User Service: Results\n    User Service-->>API Gateway: 200 OK [users]\n    API Gateway-->>Client: 200 OK [users]',pay:'sequenceDiagram\n    User->>App: Click "Pay Now"\n    App->>Stripe: Create PaymentIntent\n    Stripe-->>App: client_secret\n    App->>User: Show payment form\n    User->>Stripe: Enter card details\n    Stripe-->>App: Webhook: payment_intent.succeeded\n    App->>DB: Update order status\n    App-->>User: Show success page'};
async function run(){render()}
function setEx(n){document.getElementById('input').value=EX[n]||'';render()}
async function render(){const code=document.getElementById('input').value.trim();const o=document.getElementById('output');if(!code){o.innerHTML='';return}try{if(!window.mermaid){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';document.head.appendChild(s);await new Promise(r=>s.onload=r);mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose'})}const{svg}=await mermaid.render('sq'+Date.now(),code);o.innerHTML=svg;document.getElementById('status').textContent='\u2713 Rendered'}catch(e){o.textContent='\u2717 '+e.message.split('\n')[0]}}
document.addEventListener('DOMContentLoaded',render)</script>
